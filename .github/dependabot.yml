version: 2
updates:
  # Frontend (React/Vite/TypeScript)
  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 (Go-Port): typescript-eslint unterstützt nur TS < 6.1, ESLint stürzt sonst ab.
      # Wieder freigeben, sobald typescript-eslint TS 7 unterstützt.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-production:
        dependency-type: "production"
      frontend-development:
        dependency-type: "development"

  # Backend (FastAPI/Python)
  - package-ecosystem: "pip"
    directory: "/src/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Issue #493: PyMuPDF 2 lädt beim Import Modelldateien, die PyInstaller nicht mitpackt
      # (Sidecar: „Paket ansehen“ und OCR scheitern) – requirements.txt pinnt bewusst <2.
      # Ganz ausgenommen: Dependabot hebt bei einer Bereichsangabe die Obergrenze an (<2 → <3),
      # das zählt nicht als Major-Update und rutschte am Ausschluss vorbei (PR #542).
      # Innerhalb von 1.x zieht pip ohnehin die neueste Version.
      - dependency-name: "pymupdf"
    groups:
      backend-production:
        dependency-type: "production"
      backend-development:
        dependency-type: "development"

  # Desktop-Wrapper (Tauri/Rust)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      tauri-production:
        dependency-type: "production"
      tauri-development:
        dependency-type: "development"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
